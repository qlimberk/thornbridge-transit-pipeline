[project]
name = "fleetsense"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "pandera[polars]>=0.20.0",
    "httpx>=0.27.0",
    "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]