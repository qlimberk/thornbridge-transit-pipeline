name: "FleetSense - Week 2: Data Pipeline & Quality Validation"

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest -v
