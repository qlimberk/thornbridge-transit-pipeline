<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"values": [{"weekday": "Sunday", "weekday_number": 0, "total_trips": 5272104}, {"weekday": "Monday", "weekday_number": 1, "total_trips": 5113600}, {"weekday": "Tuesday", "weekday_number": 2, "total_trips": 5901365}, {"weekday": "Wednesday", "weekday_number": 3, "total_trips": 6117681}, {"weekday": "Thursday", "weekday_number": 4, "total_trips": 6428083}, {"weekday": "Friday", "weekday_number": 5, "total_trips": 6103820}, {"weekday": "Saturday", "weekday_number": 6, "total_trips": 6231492}]}, "mark": {"type": "bar"}, "encoding": {"tooltip": [{"field": "weekday", "title": "Weekday", "type": "ordinal"}, {"field": "total_trips", "format": ",", "title": "Total Trips", "type": "quantitative"}], "x": {"axis": {"labelAngle": 0}, "field": "weekday", "sort": null, "title": "Weekday", "type": "ordinal"}, "y": {"field": "total_trips", "title": "Total Trips", "type": "quantitative"}}, "height": 400, "title": "Pickup Trips by Weekday", "width": 700, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
