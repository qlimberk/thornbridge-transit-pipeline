<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"values": [{"DOLocationID": 236, "total_trips": 1793144}, {"DOLocationID": 237, "total_trips": 1723796}, {"DOLocationID": 161, "total_trips": 1539894}, {"DOLocationID": 230, "total_trips": 1310972}, {"DOLocationID": 170, "total_trips": 1212845}, {"DOLocationID": 162, "total_trips": 1183358}, {"DOLocationID": 142, "total_trips": 1141623}, {"DOLocationID": 239, "total_trips": 1131525}, {"DOLocationID": 68, "total_trips": 1075680}, {"DOLocationID": 141, "total_trips": 1061285}]}, "mark": {"type": "bar"}, "encoding": {"tooltip": [{"field": "DOLocationID", "title": "Drop-off Location ID", "type": "ordinal"}, {"field": "total_trips", "format": ",", "title": "Total Trips", "type": "quantitative"}], "x": {"axis": {"labelAngle": 0}, "field": "DOLocationID", "sort": null, "title": "Drop-off Location ID", "type": "ordinal"}, "y": {"field": "total_trips", "title": "Total Trips", "type": "quantitative"}}, "height": 400, "title": "Top 10 Drop-off Zones", "width": 700, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
